<style>
/* Layout: phone-first flow (pick → paint → sent) + a wide wall view for the projector */
:root{
  --bg:#15124F; --panel:#0B1238; --card:#1D1A63; --ink:#FFF8E8; --sub:#C2CCE4;
  --gold:#FFD23F; --paper:#FFF8E8; --line:rgba(255,255,255,.14);
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;min-height:100%}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;text-wrap:balance;margin:0}
.view{max-width:520px;margin:0 auto;padding-block:22px 34px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:3px;color:var(--gold)}
.sub{color:var(--sub);font-size:14.5px;line-height:1.5;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cardBtn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.cardBtn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cardBtn canvas{width:76px;height:76px}
.cardBtn span{font:600 12.5px Inter}
button{font-family:inherit}
.bar{display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer}
.canvasWrap{background:var(--paper);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
#paintCanvas{width:min(100%,360px);touch-action:none;border-radius:12px;cursor:crosshair}
.hint{color:#8A8372;font-size:12.5px;margin:0}
.palette{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px #fff}
.tools{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--sub);font-size:13px}
.brush{border-radius:50%;background:#C9D3E3;border:none;cursor:pointer;padding:0}
.brush[aria-pressed="true"]{background:#fff;box-shadow:0 0 0 3px #3F6BFF}
.ghost{background:none;border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600}
.primary{background:var(--gold);color:#12305C;border:none;border-radius:14px;min-height:52px;font:800 17px Poppins;cursor:pointer;letter-spacing:.5px}
.note{color:var(--sub);font-size:12px;text-align:center;margin:0}
.boardScroller{overflow-x:auto;border-radius:16px}
.board{min-width:1190px;background:var(--panel);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.boardHead{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 18px;background:#080D2A}
.cols{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));position:relative}
.sky{position:absolute;left:0;right:0;top:0;bottom:170px;pointer-events:none;overflow:hidden;z-index:2}
.fl{position:absolute;left:0;top:0;will-change:transform}
.fl .in{position:relative;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.fl img{display:block;width:100%}
.col{position:relative;min-height:560px;border-left:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column}
.col .big{font:800 86px/1 Poppins;text-align:center;margin-top:8px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.col .meaning{margin-top:auto;background:rgba(5,8,34,.55);border-top:3px solid;padding:9px 9px 11px;display:flex;flex-direction:column;gap:5px;min-height:170px;box-sizing:border-box}
.col .meaning b{font:700 12.5px Poppins;display:flex;align-items:center;gap:6px}
.col .meaning i{font:500 10px/1.35 Inter;font-style:normal;color:rgba(255,255,255,.85)}
.chipL{flex:none;width:20px;height:20px;border-radius:50%;color:#12305C;font:800 12px/20px Poppins;text-align:center}
.stick{position:absolute;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.stick img{display:block;width:100%}
@media (prefers-reduced-motion:no-preference){
  .stick{animation:bob 4.2s ease-in-out infinite alternate}
  .fl.pop img{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes bob{from{transform:translateY(-5px) rotate(var(--r,0deg))}to{transform:translateY(7px) rotate(var(--r,0deg))}}
}
.justSent{position:absolute;background:var(--gold);color:#12305C;font:800 11px Poppins;padding:3px 9px;border-radius:999px;letter-spacing:.5px}
.wallWide .view{max-width:1240px}
.sentWrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.sentWrap img{width:min(62vw,260px);filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pillBtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 18px;font:700 14px Poppins;cursor:pointer}

/* ---- Value Rush (3-screen tap race) ---- */
body.rushMode{padding:0;overflow:hidden;background:#0B1238;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rushP{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:2vh;padding:max(2vh,env(safe-area-inset-top,0px)) max(2.5vw,env(safe-area-inset-right,0px)) max(2vh,env(safe-area-inset-bottom,0px)) max(2.5vw,env(safe-area-inset-left,0px));box-sizing:border-box;border-top:12px solid var(--pc)}
.rpTop{display:flex;justify-content:space-between;align-items:baseline;font:800 clamp(22px,4vh,40px) Poppins;color:var(--pc)}
.rpTop span{font:700 clamp(16px,2.6vh,26px) Poppins;color:#C2CCE4}
.rpMsg{font:700 clamp(18px,3vh,30px) Poppins;color:#fff;text-align:center;min-height:1.3em}
.rpGrid{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:2vmin}
.rpTile{border:none;border-radius:3vmin;color:#12305C;font:800 min(20vw,20vh)/1 Poppins;box-shadow:inset 0 -1.4vmin 0 rgba(0,0,0,.28);touch-action:manipulation;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.rpTile:active:not(:disabled){transform:scale(.96);filter:brightness(1.15)}
.rpTile:disabled{opacity:.38;cursor:default}
.rushTV{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:2.4vw 3.4vw;box-sizing:border-box;color:#fff;background:radial-gradient(120% 90% at 50% 0%,#17306b 0%,#0B1238 70%)}
.rtHead{display:flex;justify-content:space-between;align-items:baseline;font:800 2.6vw Poppins;letter-spacing:.1vw}
.rtHead small{font:600 1.3vw Inter;color:#FFD23F;letter-spacing:.4vw}
.rtMain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.2vw}
.rtLabel{font:800 1.6vw Poppins;color:#FFD23F;letter-spacing:.5vw}
.rtQ{font:600 3.6vw/1.28 Poppins;max-width:80vw}
.rtBar{width:70vw;height:1.2vw;background:rgba(255,255,255,.12);border-radius:1vw;overflow:hidden}
.rtBar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3DBB5D,#FFD23F,#F0483E)}
.rtBig{width:14vw;height:14vw;border-radius:2vw;display:flex;align-items:center;justify-content:center;font:800 10vw/1 Poppins;color:#12305C}
.rtBtn{background:#FFD23F;color:#12305C;border:none;border-radius:1.4vw;padding:1.2vw 3.6vw;font:800 2.2vw Poppins;cursor:pointer}
.rtScore{display:flex;justify-content:center;gap:12vw;font:800 4.6vw Poppins}
.rtScore div{padding:.4vw 3vw;border-radius:1.6vw;border:.35vw solid transparent}
.rtScore .w{border-color:#FFE58A;background:rgba(255,226,138,.12)}
.rtLinks a{color:#9FB6D9;font:600 15px Inter}
.adm input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #cfd6e6;font:500 16px Inter}
.admBtn{padding:10px 16px;border:0;border-radius:10px;background:#3D5AFE;color:#fff;font:700 14px Inter;cursor:pointer}.admBtn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.admBar{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font:600 15px Inter}.admErr{color:#E5484D;font:600 14px Inter;min-height:1em}.admNote{font:600 15px Inter}
.admGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.admCard{background:#fff;border:1px solid #e2e7f3;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;color:#1b2540}
.admImg{aspect-ratio:1;background:#f3f5fb;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.admImg img{max-width:100%;max-height:100%}
.mdBack{position:fixed;inset:0;background:rgba(5,8,30,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.mdBox{background:#1B1F5C;color:#fff;border-radius:22px;border-top:8px solid var(--mc);padding:22px 20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center;animation:mdIn .22s ease-out}.mdBox h3{font:800 26px Poppins;margin:0}.mdBox p{font:500 17px/1.45 Inter;margin:0 0 6px}.mdBox small{font:700 11px Inter;letter-spacing:.08em;opacity:.75}.mdBox .primary,.mdBox .ghost{width:100%}.mdTile{width:64px;height:64px;border-radius:16px;background:var(--mc);display:flex;align-items:center;justify-content:center;font:800 38px Poppins;color:#fff}@keyframes mdIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.meanCard{border-left:6px solid var(--mc);background:rgba(127,127,127,.12);border-radius:12px;padding:10px 14px}.meanCard small{font:700 11px Inter;letter-spacing:.08em;opacity:.75}.meanCard p{margin:4px 0 0;font:600 15px/1.4 Inter}
.admMeta{font:500 13px/1.3 Inter}.admKey{color:#6b7694;word-break:break-all;font:500 11px Inter;user-select:all}.admBtn.del{background:#E5484D}.admBtn.del.arm{background:#B3261E}
</style>

<script>
"use strict";
const V=[["M","Mastery","#4F7BFF","MUIC is a culture of mastery where people always pursue excellence in their work, in themselves, and in their environment."],
["A","Altruism","#2DBE7B","MUIC is a culture of altruism where our ultimate value is to expand people's potential, enrich their lives, and help them shape a sustainable future."],
["H","Harmony","#1FC4D6","MUIC is a culture of harmony where people work together and interact with one another with peace, positivity, and pleasantness."],
["I","Integrity","#A974FF","MUIC is a culture of integrity where responsibility, fairness, and moral courage are integrated into the way we work and the way we treat one another."],
["D","Determination","#FF5A52","MUIC is a culture of determination where people keep moving forward with great strength despite challenges and tensions."],
["O","Originality","#FF9440","MUIC is a culture of originality where novelty and innovation are created on the strong foundation of our heritage."],
["L","Leadership","#FFD23F","MUIC is a culture where leadership is practiced by all as a way to empower ourselves, set our own path, and step out of our comfort zone."],
["I","Inclusion","#FF5FA2","MUIC is a culture of inclusiveness where diverse people are accepted and appreciated and this diversity flourishes into a creation greater than the sum of each individual."],
["C","Connectedness","#5CC8FF","MUIC is a culture of connectedness where professional connections are established with purpose to help bridge our students, our customers, our people, and our MU/MUOL to a greater and wider ecosystem."]];
V.forEach(v=>{v[3]=v[3].replace(/^MUIC is a culture (?:of \w+ )?where /i,'');v[3]=v[3][0].toUpperCase()+v[3].slice(1);});
const FACE={M:[[112,120],[208,120],12,[160,160],44],A:[[143,112],[177,112],9,[160,134],22],
H:[[84,128],[236,128],14,[160,163],58],I:[[143,118],[177,118],10,[160,150],30],
D:[[226,138],[262,138],10,[244,172],28],O:[[128,90],[192,90],11,[160,112],34],
L:[[88,112],[122,112],10,[105,144],28],C:[[50,142],[88,142],10,[69,174],28]};
const PAL=["#F0483E","#FF8A2B","#FFD43B","#3DBB5D","#49B6FF","#3F6BFF","#9B5DE5","#FF6FAE","#1B1B3A","#FFFFFF"];
const S=320, FONT='800 300px Poppins, Arial, sans-serif';
const app=document.getElementById('app');
let fontsReady=false;
const fontsP=(document.fonts&&document.fonts.load)?document.fonts.load(FONT).then(()=>{fontsReady=true}).catch(()=>{}):Promise.resolve();

function glyph(ctx,L,mode,color){ctx.font=FONT;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  if(mode==='fill'){ctx.fillStyle=color;ctx.fillText(L,160,265);}else{ctx.strokeStyle=color;ctx.lineJoin='round';ctx.lineWidth=mode;ctx.strokeText(L,160,265);}}
function drawFace(ctx,L){const f=FACE[L];if(!f)return;const[[x1,y1],[x2,y2],r,[sx,sy],w]=f;
  for(const[cx,cy]of[[x1,y1],[x2,y2]]){ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#1B1B3A';ctx.stroke();
    ctx.beginPath();ctx.arc(cx+2,cy+2,r*.5,0,7);ctx.fillStyle='#1B1B3A';ctx.fill();}
  ctx.beginPath();ctx.moveTo(sx-w/2,sy);ctx.quadraticCurveTo(sx,sy+w*.5,sx+w/2,sy);
  ctx.lineCap='round';ctx.lineWidth=10;ctx.strokeStyle='#fff';ctx.stroke();ctx.lineWidth=5;ctx.strokeStyle='#1B1B3A';ctx.stroke();}
function makeMask(L){const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');glyph(x,L,'fill','#fff');return c;}
// sticker = white border + cream letter + paint clipped inside + colored outline + face
function compose(target,vi,strokesCanvas){const[L,,col]=V[vi];const ctx=target.getContext('2d');ctx.clearRect(0,0,S,S);
  glyph(ctx,L,26,'#FFFBEF');glyph(ctx,L,'fill','#FFFBEF');
  if(strokesCanvas){const clip=document.createElement('canvas');clip.width=clip.height=S;const cx=clip.getContext('2d');
    cx.drawImage(strokesCanvas,0,0);cx.globalCompositeOperation='destination-in';cx.drawImage(makeMask(L),0,0);ctx.drawImage(clip,0,0);}
  glyph(ctx,L,10,col);drawFace(ctx,L);}

/* ---------- Shared wall (Firebase Realtime Database) ---------- */
const FB_CONFIG={apiKey:"AIzaSyD-mBQ0jyxSeRYyaVmN8ShJBrPmxWxYKmU",authDomain:"draw-your-letter-digital-wall.firebaseapp.com",
  databaseURL:"https://draw-your-letter-digital-wall-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"draw-your-letter-digital-wall",storageBucket:"draw-your-letter-digital-wall.firebasestorage.app",
  messagingSenderId:"791054427546",appId:"1:791054427546:web:e1957b12eac678e5804623"};
const MODERATE=false; // true = a drawing only shows once you set ok:true on it in the Firebase console (student-club approval)
let db=null;
try{if(window.firebase&&firebase.database){firebase.initializeApp(FB_CONFIG);db=firebase.database();}}catch(e){db=null;}

let last=null;try{last=JSON.parse(localStorage.getItem('dyl2')||'null');}catch(e){}
function saveLast(){try{localStorage.setItem('dyl2',JSON.stringify(last));}catch(e){}}

const cloud=new Map();           // key -> {key,vi,img,t,arrived}
let loaded=false,connected=false,wall=null,dirty=new Set(),raf=0,wasEmpty=true,demoList=null;
const okImg=s=>typeof s==='string'&&/^data:image\/(webp|png);base64,[A-Za-z0-9+\/=]+$/.test(s);
function take(s){const d=s.val();if(!d||!okImg(d.img)||!(d.vi>=0&&d.vi<9))return;
  if(MODERATE&&d.ok!==true){if(cloud.delete(s.key))ping(d.vi);return;}
  cloud.set(s.key,{key:s.key,vi:d.vi|0,img:d.img,t:d.t||0,arrived:loaded?Date.now():0});ping(d.vi|0);
  if(loaded)setTimeout(()=>ping(d.vi|0),20500);}
function ping(vi){dirty.add(vi);if(!raf)raf=requestAnimationFrame(flush);}
function flush(){raf=0;const d=dirty;dirty=new Set();if(!wall)return;
  syncFloaters();setStatus();}
if(db){const q=db.ref('drawings').orderByKey().limitToLast(60);
  q.on('child_added',take);q.on('child_changed',take);
  q.on('child_removed',s=>{const d=cloud.get(s.key);cloud.delete(s.key);if(d)ping(d.vi);});
  q.once('value',()=>{loaded=true;});
  db.ref('.info/connected').on('value',s=>{connected=!!s.val();setStatus();});}
function setStatus(){const n=wall&&wall.status;if(!n)return;
  n.textContent=db?(connected?'● LIVE · '+cloud.size+' painted':'○ connecting…'):'○ offline preview';
  n.style.color=connected?'#6CF0A0':'#FFD23F';}
function ensureDemos(){if(demoList)return;demoList=[];
  const seeds=[[0,'#49B6FF','#FFF8E8'],[2,'#3DBB5D','#FFD43B'],[5,'#FF8A2B','#FFD43B'],[8,'#9B5DE5','#FF6FAE']];
  for(const[vi,a,b]of seeds){const sc=document.createElement('canvas');sc.width=sc.height=S;const x=sc.getContext('2d');
    x.fillStyle=a;x.fillRect(0,0,S,S);x.fillStyle=b;for(let r=0;r<8;r++)for(let c=0;c<8;c++){x.beginPath();x.arc(20+c*44+(r%2?22:0),30+r*40,11,0,7);x.fill();}
    const t=document.createElement('canvas');t.width=t.height=S;compose(t,vi,sc);
    demoList.push({key:'demo'+vi,vi,img:t.toDataURL('image/png'),demo:1});}}
function seeded(k){let s=2166136261;for(const ch of k){s^=ch.charCodeAt(0);s=Math.imul(s,16777619);}s=(s>>>0)||1;
  return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
const flo=new Map();let loopOn=false,lastT=0;
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function syncFloaters(){if(!wall)return;const sky=wall.sky,W=sky.clientWidth,H=sky.clientHeight;
  const want=cloud.size?[...cloud.values()].sort((a,b)=>a.key<b.key?-1:1).slice(-40):(demoList||[]);
  const keep=new Set(want.map(d=>d.key));
  for(const[k,f]of flo){if(!keep.has(k)){f.el.remove();flo.delete(k);}}
  const w=Math.max(40,Math.min(60,W/21));
  want.forEach(d=>{let f=flo.get(d.key);
    if(!f){const r=seeded(d.key);const e=el(`<div class="fl" style="width:${w}px"><div class="in"><img alt="A painted ${V[d.vi][1]}"></div></div>`);
      e.querySelector('img').src=d.img;sky.appendChild(e);
      f={el:e,in:e.firstChild,x:r()*Math.max(1,W-w),y:r()*Math.max(1,H-w),
         vx:(r()<.5?-1:1)*(14+r()*20),vy:(r()<.5?-1:1)*(9+r()*15),rot:r()*30-15,vr:(r()-.5)*7,w,isNew:true};
      flo.set(d.key,f);}
    const fresh=!!d.arrived&&Date.now()-d.arrived<20000;
    if(f.isNew){f.isNew=false;if(fresh){f.el.classList.add('pop');burst(sky,f.x+f.w/2,f.y+f.w/2,f.w);}}
    place(f);});
  if(!loopOn){loopOn=true;lastT=performance.now();requestAnimationFrame(tick);}}
function burst(sky,cx,cy,w){if(still)return;const cols=V.map(v=>v[2]);
  const ring=document.createElement('div');ring.style.cssText=`position:absolute;left:${cx-w*.5}px;top:${cy-w*.5}px;width:${w}px;height:${w}px;border-radius:50%;border:3px solid #FFE58A;pointer-events:none`;
  sky.appendChild(ring);ring.animate([{transform:'scale(.3)',opacity:.9},{transform:'scale(2.6)',opacity:0}],{duration:650,easing:'ease-out'}).onfinish=()=>ring.remove();
  for(let i=0;i<16;i++){const a=i/16*6.283+Math.random()*.3,dist=w*(.9+Math.random()*.9),sz=5+Math.random()*6;
    const e=document.createElement('div');e.style.cssText=`position:absolute;left:${cx-sz/2}px;top:${cy-sz/2}px;width:${sz}px;height:${sz}px;border-radius:${i%2?'50%':'2px'};background:${cols[i%cols.length]};pointer-events:none`;
    sky.appendChild(e);e.animate([{transform:'translate(0,0) rotate(0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px) rotate(${Math.random()*360}deg) scale(.2)`,opacity:0}],
      {duration:600+Math.random()*350,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>e.remove();}}
function place(f){f.el.style.transform=`translate(${f.x}px,${f.y}px) rotate(${f.rot}deg)`;}
function tick(t){if(!wall){loopOn=false;return;}
  const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;const W=wall.sky.clientWidth,H=wall.sky.clientHeight;
  for(const f of flo.values()){if(!still){f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;
      if(f.x<0){f.x=0;f.vx=Math.abs(f.vx);}else if(f.x>W-f.w){f.x=Math.max(0,W-f.w);f.vx=-Math.abs(f.vx);}
      if(f.y<0){f.y=0;f.vy=Math.abs(f.vy);}else if(f.y>H-f.w){f.y=Math.max(0,H-f.w);f.vy=-Math.abs(f.vy);}}
    place(f);}
  requestAnimationFrame(tick);}
let sendState='',onSend=()=>{};
function setSend(st){sendState=st;onSend();}
function fitImage(cv){let img;try{img=cv.toDataURL('image/webp',.8);}catch(e){}
  if(!img||img.indexOf('data:image/webp')!==0)img=cv.toDataURL('image/png');
  if(img.length>140000){const c=document.createElement('canvas');c.width=c.height=220;c.getContext('2d').drawImage(cv,0,0,220,220);
    try{img=c.toDataURL('image/webp',.7);}catch(e){}if(!img||img.indexOf('data:image/webp')!==0)img=c.toDataURL('image/png');}
  return img;}

function route(){wall=null;const h=(location.hash||'').replace('#','');document.body.classList.toggle('rushMode',h.indexOf('rush')===0);document.body.classList.toggle('wallWide',h==='wall');

    box.querySelector('#si').onclick=()=>auth.signInWithEmailAndPassword(box.querySelector('#em').value.trim(),box.querySelector('#pw').value).catch(e=>{box.querySelector('#er').textContent='Sign in failed: '+(e.code||e.message);});}
  let off=null;

        c.querySelector('img').src=d.img||'';

          ref.child(k).remove().catch(e=>{er.textContent='Could not delete ('+(e.code||e.message)+'). Check the Firebase rules and that you are signed in as the admin.';});};
        gd.appendChild(c);});},e=>{er.textContent='Could not read drawings: '+(e.code||e.message);});

/* ---------- VALUE RUSH: 3-screen tap race (question TV + 2 player touch screens) ---------- */
const RUSH_WIN=5,RUSH_TIME=12000;
const rs=()=>db&&db.ref('rush/state');
function rushShell(html){app.innerHTML='';const v=el(html);app.appendChild(v);return v;}
function renderRushMenu(){document.body.classList.add('rushMode');
  const base=location.href.split('#')[0];
  rushShell(`<div style="padding:6vh 6vw;font:500 18px/1.8 Inter;color:#fff"><h1 style="font-size:34px;margin-bottom:12px">VALUE RUSH</h1>
   <div class="rtLinks">Open one link per screen:<br><a href="#rush-tv">Question screen (Mac / TV)</a><br><a href="#rush-p1">Player 1 (iPad)</a><br><a href="#rush-p2">Player 2 (iPad)</a><br><span style="color:#9FB6D9;font-size:14px">${base}#rush-tv</span></div></div>`);}
function renderRushPlayer(pid){
  const col=pid==='p1'?'#49B6FF':'#FF9A3D',name=pid==='p1'?'PLAYER 1':'PLAYER 2';
  const v=rushShell(`<div class="rushP" style="--pc:${col}"><div class="rpTop"><b>${name}</b><span id="sc"></span></div><div class="rpMsg" id="msg">Waiting for the question…</div><div class="rpGrid" id="gr"></div></div>`);
  const gr=v.querySelector('#gr'),msg=v.querySelector('#msg'),sc=v.querySelector('#sc');
  const tiles=V.map(([L,n,c],i)=>{const b=document.createElement('button');b.className='rpTile';b.style.background=c;b.textContent=L;b.setAttribute('aria-label',L);gr.appendChild(b);return b;});
  let st={},seen=0,seenRound=-1,locked=false;
  const who=x=>x==='p1'?'Player 1':'Player 2';
  function paint(){const playing=st.status==='playing',s=st.scores||{};
    sc.textContent='P1 '+(s.p1||0)+' \u00B7 P2 '+(s.p2||0);
    tiles.forEach(b=>b.disabled=!playing||locked);
    if(!db)msg.textContent='Not connected to the game';
    else if(playing)msg.textContent=locked?'Wrong letter! Wait a moment\u2026':'GO! Tap the matching letter';
    else if(st.status==='won')msg.textContent=st.winner===pid?'You were first! '+(st.winMs/1000).toFixed(2)+' s':who(st.winner)+' was first';
    else if(st.status==='timeout')msg.textContent="Time's up. It was "+V[st.q][0]+' \u00B7 '+V[st.q][1];
    else if(st.status==='final')msg.textContent=(st.winner===pid?'YOU WIN THE GAME!':who(st.winner)+' wins the game');
    else msg.textContent='Waiting for the question\u2026';}
  if(rs())rs().on('value',s=>{const n=s.val()||{};
    if(n.status==='playing'&&n.round!==seenRound){seenRound=n.round;seen=performance.now();locked=false;}
    st=n;paint();});
  tiles.forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.preventDefault();
    if(st.status!=='playing'||locked||!db)return;
    const ms=Math.round(performance.now()-seen),round=st.round;
    if(i!==st.q){locked=true;paint();setTimeout(()=>{locked=false;paint();},1500);return;}
    rs().transaction(cur=>{if(!cur||cur.status!=='playing'||cur.round!==round)return;
      cur.status='won';cur.winner=pid;cur.winMs=ms;cur.scores=cur.scores||{p1:0,p2:0};cur.scores[pid]=(cur.scores[pid]||0)+1;return cur;});}));
  paint();}
function renderRushTV(){
  const v=rushShell(`<div class="rushTV"><div class="rtHead"><span>VALUE RUSH</span><small id="rd"></small></div><div class="rtMain" id="mn"></div><div class="rtScore" id="sb"></div></div>`);
  const mn=v.querySelector('#mn'),sb=v.querySelector('#sb'),rd=v.querySelector('#rd');
  let st={status:'idle'},timers=[];
  const clr=()=>{timers.forEach(clearTimeout);timers=[];};
  const who=x=>x==='p1'?'PLAYER 1':'PLAYER 2';
  function nextRound(b){const used=(b.used||[]).slice();let pool=V.map((_,i)=>i).filter(i=>!used.includes(i));
    if(!pool.length){used.length=0;pool=V.map((_,i)=>i);}
    const q=pool[Math.floor(Math.random()*pool.length)];used.push(q);
    rs().set({round:Date.now(),n:(b.n||0)+1,q,status:'playing',winner:null,winMs:null,scores:b.scores||{p1:0,p2:0},used});}
  function newGame(){nextRound({n:0,scores:{p1:0,p2:0},used:[]});}
  function draw(){const s=st.scores||{p1:0,p2:0};
    rd.textContent=st.n?('ROUND '+st.n+' \u00B7 FIRST TO '+RUSH_WIN):('FIRST TO '+RUSH_WIN+' WINS');
    sb.innerHTML='<div class="'+(st.status==='won'&&st.winner==='p1'||st.status==='final'&&st.winner==='p1'?'w':'')+'" style="color:#49B6FF">P1 \u00B7 '+(s.p1||0)+'</div><div class="'+(st.status==='won'&&st.winner==='p2'||st.status==='final'&&st.winner==='p2'?'w':'')+'" style="color:#FF9A3D">P2 \u00B7 '+(s.p2||0)+'</div>';
    if(!db){mn.innerHTML='<div class="rtQ">Not connected to the game server.</div>';return;}
    if(st.status==='playing'){mn.innerHTML='<div class="rtLabel">WHICH VALUE?</div><div class="rtQ">\u201C'+V[st.q][3]+'\u201D</div><div class="rtBar"><i id="bar" style="transition:width '+RUSH_TIME+'ms linear"></i></div><div class="rtLabel" style="color:#9FB6D9">Tap the matching letter on your screen</div>';
      const bar=mn.querySelector('#bar');requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width='0%';}));}
    else if(st.status==='won'||st.status==='timeout'){const c=V[st.q][2];
      mn.innerHTML='<div class="rtBig" style="background:'+c+'">'+V[st.q][0]+'</div><div class="rtQ" style="font-size:3vw">'+V[st.q][1]+'</div><div class="rtLabel">'+(st.status==='won'?who(st.winner)+' \u00B7 '+(st.winMs/1000).toFixed(2)+' s':"TIME'S UP")+'</div>';}
    else if(st.status==='final'){mn.innerHTML='<div class="rtLabel">GAME OVER</div><div class="rtQ" style="font-size:5vw">'+who(st.winner)+' WINS!</div><button class="rtBtn" id="go">PLAY AGAIN</button>';mn.querySelector('#go').onclick=newGame;}
    else{mn.innerHTML='<div class="rtQ" style="font-size:4.4vw">Smash the value that matches the meaning</div><div class="rtLabel" style="color:#9FB6D9">Open #rush-p1 on iPad 1 and #rush-p2 on iPad 2</div><button class="rtBtn" id="go">START</button>';mn.querySelector('#go').onclick=newGame;}}
  if(rs())rs().on('value',s=>{st=s.val()||{status:'idle'};clr();draw();
    if(st.status==='playing'){const r=st.round;timers.push(setTimeout(()=>{rs().transaction(c=>{if(c&&c.status==='playing'&&c.round===r){c.status='timeout';return c;}});},RUSH_TIME));}
    if(st.status==='won'||st.status==='timeout'){timers.push(setTimeout(()=>{
      if(st.status==='won'&&(st.scores[st.winner]||0)>=RUSH_WIN)rs().update({status:'final'});else nextRound(st);},3800));}});
  else draw();}


function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}

function renderPick(){app.innerHTML='';const v=el(`<div class="view">
  <div class="eyebrow">THE MUIC JOURNEY · ADITAYATHORN WALL</div>
  <h1 style="font-size:28px">Pick your letter</h1>
  <p class="sub">Every MUIC core value is a character. Choose one and paint it your way.</p>
  <div class="grid" id="g"></div>
  <p class="note">Your painting joins the wall when you press send.</p>
  <div class="row"><button class="pillBtn" id="toWall">Open the wall view</button></div></div>`);
  const g=v.querySelector('#g');
  V.forEach((val,i)=>{const b=el(`<button class="cardBtn" id="pick-${i}" aria-label="Paint ${val[1]}"><canvas width="${S}" height="${S}"></canvas><span>${val[1]}</span></button>`);
    b.onclick=()=>{cur={vi:i,strokes:[],color:PAL[3],size:14,drawing:null};location.hash='paint-'+i;};
    g.appendChild(b);fontsP.then(()=>compose(b.querySelector('canvas'),i,null));});
  v.querySelector('#toWall').onclick=()=>location.hash='wall';app.appendChild(v);}

function renderPaint(vi){cur.vi=vi;const[L,name,col,meaning]=V[vi];app.innerHTML='';
  const v=el(`<div class="view">
   <div class="bar"><button class="back" id="bk" aria-label="Back">&#8592;</button>
     <h2 style="font-size:21px">${L} · ${name}</h2></div>
   <div class="canvasWrap"><canvas id="paintCanvas" width="${S}" height="${S}"></canvas>
     <p class="hint">Paint inside the letter — it keeps your color inside the lines.</p></div>
   <div class="palette" id="pal"></div>
   <div class="tools"><span>Brush</span>
     <button class="brush" id="b1" style="width:14px;height:14px" aria-label="Small brush"></button>
     <button class="brush" id="b2" style="width:20px;height:20px" aria-pressed="true" aria-label="Medium brush"></button>
     <button class="brush" id="b3" style="width:28px;height:28px" aria-label="Big brush"></button>
     <span style="margin-left:auto"></span>
     <button class="ghost" id="undo">Undo</button><button class="ghost" id="clr">Clear</button></div>
   <button class="primary" id="send">CONTINUE</button>
   <p class="note">Your painting appears on the big wall in the Aditayathorn corridor.</p></div>`);
  app.appendChild(v);
  const cv=v.querySelector('#paintCanvas'),ctx=cv.getContext('2d');
  const sc=document.createElement('canvas');sc.width=sc.height=S;const sx=sc.getContext('2d');
  const pal=v.querySelector('#pal');
  PAL.forEach((p,i)=>{const s=el(`<button class="swatch" id="sw-${i}" style="background:${p}" aria-label="Color ${p}" aria-pressed="${p===cur.color}"></button>`);
    s.onclick=()=>{cur.color=p;pal.querySelectorAll('.swatch').forEach(w=>w.setAttribute('aria-pressed','false'));s.setAttribute('aria-pressed','true');};
    pal.appendChild(s);});
  const sizes={b1:8,b2:14,b3:24};
  for(const id in sizes){v.querySelector('#'+id).onclick=e=>{cur.size=sizes[id];
    v.querySelectorAll('.brush').forEach(b=>b.setAttribute('aria-pressed','false'));e.currentTarget.setAttribute('aria-pressed','true');};}
  function redraw(){sx.clearRect(0,0,S,S);for(const st of cur.strokes){sx.strokeStyle=st.c;sx.lineWidth=st.s;sx.lineCap=sx.lineJoin='round';
      sx.beginPath();st.p.forEach(([x,y],i)=>i?sx.lineTo(x,y):sx.moveTo(x,y));if(st.p.length===1)sx.lineTo(st.p[0][0]+.1,st.p[0][1]);sx.stroke();}
    compose(cv,vi,sc);}
  fontsP.then(redraw);
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height];};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);cur.drawing={c:cur.color,s:cur.size,p:[pos(e)]};cur.strokes.push(cur.drawing);redraw();});
  cv.addEventListener('pointermove',e=>{if(cur.drawing){cur.drawing.p.push(pos(e));redraw();}});
  const stop=()=>{cur.drawing=null;};cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
  v.querySelector('#undo').onclick=()=>{cur.strokes.pop();redraw();};
  v.querySelector('#clr').onclick=()=>{cur.strokes=[];redraw();};
  v.querySelector('#bk').onclick=()=>{location.hash='';};
  v.querySelector('#send').onclick=()=>{if(!cur.strokes.length){v.querySelector('.hint').textContent='Paint something first \u2014 tap a color and draw!';return;}
    const m=el(`<div class="mdBack"><div class="mdBox" role="dialog" aria-modal="true" style="--mc:${col}"><div class="mdTile">${L}</div>
      <small>WHAT ${name.toUpperCase()} MEANS AT MUIC</small><h3>${name}</h3><p>${meaning}</p>
      <button class="primary" id="go">SEND TO THE WALL</button><button class="ghost" id="keep">Keep painting</button></div></div>`);
    document.body.appendChild(m);
    m.querySelector('#keep').onclick=()=>m.remove();
    m.querySelector('#go').onclick=e=>{e.currentTarget.disabled=true;redraw();const img=fitImage(cv);
      last={vi,img,t:Date.now()};saveLast();setSend('sending');
      if(db){db.ref('drawings').push({letter:L,vi,img,t:firebase.database.ServerValue.TIMESTAMP}).then(()=>setSend('ok'),()=>setSend('fail'));}
      else setSend('offline');
      m.remove();location.hash='sent';};};}
